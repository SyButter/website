name: Deploy to Namecheap

# Auto-deploys the site to Namecheap shared hosting over FTP on every
# push to main. Mirrors the files listed in .cpanel.yml.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Encrypted FTP (explicit TLS over port 21) — the account password
          # is the cPanel password, so don't send it in cleartext.
          protocol: ftps
          # The deploy@sbadar.com FTP account is homed at public_html, so it
          # logs in directly at the web root — deploy into the home itself.
          server-dir: ./
          # Only ship what the site actually needs. node_modules, git
          # metadata, and local cruft are excluded.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            package.json
            package-lock.json
            tailwind.config.js
            style.css
            .cpanel.yml
            .github/**
            .htaccess
